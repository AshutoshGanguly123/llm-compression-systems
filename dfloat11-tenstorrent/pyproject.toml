[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "df11-tt"
version = "0.1.0"
description = "DFloat11 lossless weight compression for Tenstorrent"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]
