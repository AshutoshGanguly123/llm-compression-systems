# Qwen / tt_transformers PoC — used by scripts/serve_qwen_poc.py and run_qwen_smoke.py
#
# Prerequisites: TT_METAL_HOME, run with tt-metal’s Python (ttnn on PYTHONPATH).

runner:
  hf_model: Qwen/Qwen2.5-1.5B-Instruct
  mesh_rows: 1
  # Qwen2.5-1.5B has num_key_value_heads=2 → mesh width must divide 2 (1 or 2; not 4).
  # Vanilla PoC: 1 device (simplest; avoids multi-chip fabric subset issues).
  mesh_cols: 1
  # Optional: pin specific PCIe device indices (length must equal mesh_cols). Example 2-chip: [0, 1]
  physical_device_ids: null
  # For mesh_cols: 1 only: set false if ethernet/fabric init fails after a clean board reset.
  fabric: true
  instruct: true
  max_seq_len: 4096
  max_batch_size: 1
  data_parallel: 1
  paged_attention: true
  page_block_size: 32
  page_max_num_blocks_per_dp: 1024
  use_prefetcher: false
  # num_layers: null  # full model

serve:
  host: "0.0.0.0"
  port: 8765

generation:
  # Keep small for fast first green run; raise once stable.
  max_new_tokens: 24
  temperature: 0.0
  top_p: 0.08
  top_k: 32
  stop_at_eos: true
